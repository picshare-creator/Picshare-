<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PicShare — Social App Demo</title>
<style>
:root{--bg:#fafafa;--card:#fff;--text:#171717;--muted:#737373;--line:#e7e7e7;--accent:#d94683;--accent2:#8b5cf6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;background:#ffffffeb;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topinner{max-width:1080px;margin:auto;height:62px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{font-size:25px;font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:transparent;background-clip:text}.search{width:min(280px,35vw);border:1px solid var(--line);border-radius:12px;background:#f5f5f5;padding:9px 12px;outline:none}.navicons{display:flex;gap:8px}.iconbtn{border:0;background:transparent;border-radius:10px;padding:8px;font-size:20px}.iconbtn:hover{background:#f0f0f0}.layout{max-width:1080px;margin:24px auto;display:grid;grid-template-columns:minmax(0,650px) 300px;gap:32px;padding:0 18px}.stories{display:flex;gap:14px;overflow:auto;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:18px}.story{flex:0 0 68px;text-align:center;font-size:12px;color:var(--muted)}.ring{width:60px;height:60px;border-radius:50%;padding:3px;margin:0 auto 6px;background:linear-gradient(135deg,#f97316,#ec4899,#8b5cf6)}.ring img,.avatar{width:100%;height:100%;object-fit:cover;border-radius:50%;border:2px solid white}.post{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:20px}.posthead{display:flex;align-items:center;gap:10px;padding:12px 14px}.avatar{width:38px;height:38px;border:0}.username{font-weight:750;font-size:14px}.sub{font-size:12px;color:var(--muted);margin-top:2px}.more{margin-left:auto;border:0;background:transparent;font-size:22px}.photo{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#eee}.actions{display:flex;align-items:center;padding:9px 12px 0;gap:8px}.actions button{border:0;background:none;font-size:24px;padding:3px}.actions .save{margin-left:auto}.postbody{padding:3px 14px 14px;font-size:14px}.likes{font-weight:750;margin:4px 0 7px}.caption{line-height:1.45}.comments{color:var(--muted);margin-top:6px;cursor:pointer}.commentrow{display:flex;border-top:1px solid var(--line);padding:10px 12px;gap:8px}.commentrow input{flex:1;min-width:0;border:0;outline:0;background:transparent}.textbtn{border:0;background:none;color:#c02672;font-weight:750}.side{position:sticky;top:86px;height:max-content}.me{display:flex;align-items:center;gap:12px;margin:8px 0 24px}.me .avatar{width:48px;height:48px}.suggesttitle{display:flex;justify-content:space-between;color:var(--muted);font-weight:700;font-size:14px;margin-bottom:14px}.suggest{display:flex;align-items:center;gap:10px;margin:13px 0}.suggest .avatar{width:36px;height:36px}.suggest .textbtn{margin-left:auto;font-size:12px}.tiny{font-size:11px;color:#aaa;line-height:1.7;margin-top:26px}.primary{border:0;border-radius:12px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:white;font-weight:750;padding:10px 15px}.modalback{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}.modal{background:white;width:min(440px,100%);border-radius:18px;padding:20px;box-shadow:0 20px 70px #0003}.modal h2{margin:0 0 16px}.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin:7px 0;outline-color:var(--accent)}textarea.field{resize:vertical;min-height:85px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.secondary{border:1px solid var(--line);border-radius:10px;background:white;padding:10px 14px}.empty{padding:35px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:10px 16px;border-radius:999px;display:none;z-index:30;font-size:14px}
@media(max-width:800px){.layout{display:block;max-width:650px;margin:14px auto}.side{display:none}.search{display:none}.topinner{height:58px}.stories{border-radius:13px}.post{border-radius:13px}.photo{aspect-ratio:1/1}}@media(min-width:801px){main{min-width:0}}
</style></head>
<body>
<header class="top"><div class="topinner"><div class="logo">PicShare</div><input id="search" class="search" placeholder="यूज़र खोजें…" aria-label="Search"><div class="navicons"><button class="iconbtn" title="Home" onclick="window.scrollTo({top:0,behavior:'smooth'})">⌂</button><button class="iconbtn" title="New post" onclick="openModal()">＋</button><button class="iconbtn" title="Notifications" onclick="toast('अभी कोई नई notification नहीं है')">♡</button><button class="iconbtn" title="Profile" onclick="toast('यह demo profile है')">☺</button></div></div></header>
<div class="layout"><main><section class="stories" id="stories"></section><div id="feed"></div></main><aside class="side"><div class="me"><img class="avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377414?w=100&h=100&fit=crop" alt="Your profile"><div><div class="username">you_picshare</div><div class="sub">आपका PicShare अकाउंट</div></div><button class="textbtn" onclick="toast('प्रोफाइल सेटिंग्स जल्द आएँगी')">देखें</button></div><div class="suggesttitle"><span>आपके लिए सुझाव</span><span>सभी</span></div><div id="suggestions"></div><div class="tiny">About · Help · Privacy · Terms<br>© 2026 PicShare Demo<br><br>यह एक फ्रंट-एंड डेमो है। पोस्ट और लाइक इसी ब्राउज़र में अस्थायी रूप से रहते हैं।</div></aside></div>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>नई पोस्ट बनाएं</h2><label for="imageUrl">फोटो का URL (या खाली छोड़ें)</label><input id="imageUrl" class="field" placeholder="https://example.com/photo.jpg"><label for="captionInput">कैप्शन</label><textarea id="captionInput" class="field" placeholder="आप क्या सोच रहे हैं?"></textarea><div class="modalactions"><button class="secondary" onclick="closeModal()">रद्द करें</button><button class="primary" onclick="addPost()">पोस्ट करें</button></div><p class="sub">टिप: अभी URL वाली फोटो काम करती है; असली फोटो अपलोड के लिए सर्वर/storage जोड़ना होगा।</p></div></div><div id="toast" class="toast"></div>
<script>
const people=[
 {u:'ananya.travels',name:'Ananya',av:'photo-153452 last',img:'photo-1500530855697-b586d89ba3ee',caption:'छोटी-छोटी यात्राएँ, बड़ी-बड़ी यादें 🌿',likes:128},
 {u:'foodie_raj',name:'Raj',av:'photo-1500648767791-00dcc994a43e',img:'photo-1540189549336-e6e99c3679fe',caption:'आज की प्लेट = खुशियों की प्लेट 🍜 कौन खाएगा?',likes:86},
 {u:'daily.frames',name:'Mira',av:'photo-1531123897727-8f129e1688ce',img:'photo-1470770841072-f978cf4d019e',caption:'थोड़ा सुकून, थोड़ी धूप ☀️',likes:243}
];
const storiesData=[['Your story','photo-1535713875002-d1d0cf377414'],['ananya','photo-1534522529880-3c0f4b2e8a3a'],['raj','photo-1500648767791-00dcc994a43e'],['mira','photo-1531123897727-8f129e1688ce'],['travel','photo-1500530855697-b586d89ba3ee'],['artbyriya','photo-1524504388940-b1c1722653e1']];
const photo=(id,w=900)=>`https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=85`;
let posts=people.map((p,i)=>({id:i+1,user:p.u,avatar:photo(p.av,100),image:photo(p.img,1000),caption:p.caption,likes:p.likes,liked:false,comments:[]}));let nextId=4;
function renderStories(){document.getElementById('stories').innerHTML=storiesData.map((s,i)=>`<div class="story" onclick="toast('${i===0?'अपनी स्टोरी जोड़ने के लिए + पर क्लिक करें':'@'+s[0]+' की स्टोरी'}')"><div class="ring"><img src="${photo(s[1],100)}" alt=""></div><div>${s[0]}</div></div>`).join('')}
function renderSuggestions(){let arr=[['riya.creates','photo-1524504388940-b1c1722653e1'],['travelwithsam','photo-1506794778202-cad84cf45f1d'],['the_art_room','photo-1534522529880-3c0f4b2e8a3a']];document.getElementById('suggestions').innerHTML=arr.map(a=>`<div class="suggest"><img class="avatar" src="${photo(a[1],100)}" alt=""><div><div class="username">${a[0]}</div><div class="sub">आपके लिए सुझाव</div></div><button class="textbtn" onclick="follow(this)">फॉलो</button></div>`).join('')}
function renderFeed(filter=''){const feed=document.getElementById('feed');const filtered=posts.filter(p=>(p.user+' '+p.caption).toLowerCase().includes(filter.toLowerCase()));feed.innerHTML=filtered.length?filtered.map(p=>`<article class="post"><div class="posthead"><img class="avatar" src="${p.avatar}" alt=""><div><div class="username">${esc(p.user)}</div><div class="sub">${p.id>3?'अभी-अभी':'PicShare community'}</div></div><button class="more" aria-label="More" onclick="toast('पोस्ट विकल्प जल्द आएँगे')">···</button></div><img class="photo" src="${p.image}" alt="${esc(p.caption)}" onerror="this.src='https://placehold.co/900x700/f4e4ef/7d3565?text=PicShare'"/><div class="actions"><button aria-label="Like" onclick="toggleLike(${p.id})" style="color:${p.liked?'#e11d48':'inherit'}">${p.liked?'♥':'♡'}</button><button aria-label="Comment" onclick="document.getElementById('comment-${p.id}').focus()">♧</button><button aria-label="Share" onclick="sharePost(${p.id})">➤</button><button class="save" aria-label="Save" onclick="toast('पोस्ट सेव करने की सुविधा जल्द आएगी')">♧</button></div><div class="postbody"><div class="likes">${p.likes.toLocaleString('en-IN')} likes</div><div class="caption"><strong>${esc(p.user)}</strong> ${esc(p.caption)}</div><div id="comments-${p.id}">${p.comments.map(c=>`<div class="caption" style="margin-top:5px"><strong>${esc(c.user)}</strong> ${esc(c.text)}</div>`).join('')}</div><div class="comments" onclick="document.getElementById('comment-${p.id}').focus()">${p.comments.length?'सभी कमेंट देखें':'कमेंट करें…'}</div></div><div class="commentrow"><input id="comment-${p.id}" placeholder="कमेंट जोड़ें…" onkeydown="if(event.key==='Enter')addComment(${p.id})"><button class="textbtn" onclick="addComment(${p.id})">पोस्ट</button></div></article>`).join(''):`<div class="empty">कोई पोस्ट नहीं मिली।</div>`}
function toggleLike(id){let p=posts.find(x=>x.id===id);if(!p)return;p.liked=!p.liked;p.likes+=p.liked?1:-1;renderFeed(document.getElementById('search').value)}
function addComment(id){let input=document.getElementById('comment-'+id);if(!input||!input.value.trim())return;posts.find(p=>p.id===id).comments.push({user:'you_picshare',text:input.value.trim()});renderFeed(document.getElementById('search').value);toast('कमेंट जोड़ दिया गया')}
function openModal(){document.getElementById('modalback').style.display='flex'}function closeModal(){document.getElementById('modalback').style.display='none'}
function addPost(){const url=document.getElementById('imageUrl').value.trim();const caption=document.getElementById('captionInput').value.trim();if(!url&&!caption){toast('फोटो URL या कैप्शन डालें');return}posts.unshift({id:nextId++,user:'you_picshare',avatar:photo('photo-1535713875002-d1d0cf377414',100),image:url||'https://placehold.co/900x700/f4e4ef/7d3565?text=Your+Post',caption:caption||'मेरी नई पोस्ट ✨',likes:0,liked:false,comments:[]});document.getElementById('imageUrl').value='';document.getElementById('captionInput').value='';closeModal();renderFeed(document.getElementById('search').value);window.scrollTo({top:0,behavior:'smooth'});toast('आपकी पोस्ट फ़ीड में जुड़ गई!')}
function follow(btn){btn.textContent=btn.textContent==='फॉलो'?'फॉलो हो गया':'फॉलो';btn.style.color=btn.textContent==='फॉलो हो गया'?'#737373':''}
function sharePost(id){const p=posts.find(x=>x.id===id);if(navigator.share)navigator.share({title:'PicShare पोस्ट',text:p.caption}).catch(()=>{});else toast('पोस्ट शेयर करने के लिए अपने ब्राउज़र का शेयर विकल्प इस्तेमाल करें')}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',2400)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('search').addEventListener('input',e=>renderFeed(e.target.value));renderStories();renderSuggestions();renderFeed();
</script></body></html>
